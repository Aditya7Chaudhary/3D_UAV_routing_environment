# Structured / parametric obstacle map generator settings
# (replaces structure_map.launch)

map:
  # Physical extent of the continuous world before it is divided into voxels.
  x_size: 30.0
  y_size: 30.0
  z_size: 6.0
  x_origin: 0.0
  y_origin: 0.0
  z_origin: 0.0
  resolution: 0.2          # use 0.1 for denser maps (slower)
  inflate_radius: 0.1  # Retained config field; structure generation samples shapes directly.
  simple_2d: false     # Export a 2D occupied-column projection instead of the full 3D cloud.

params:
  occupancy_ratio: 0.35  # Shared occupied-voxel target for every environment type.
  # Relative shares of primitive occupancy for random_land and mixed maps.
  # Those presets use map-scaled primitives to keep 20% occupancy navigable.
  cylinder_ratio: 0.015
  circle_ratio: 0.005
  gate_ratio: 0.005
  ellip_ratio: 0.005
  poly_ratio: 0.01
  w1: 0.02          # Small-width lower limit and noise standard deviation/probability value.
  w2: 0.15          # Small-width upper limit and cap used when resampling ratios.
  w3: 0.6           # Upper limit for radius-like obstacle dimensions.
  add_noise: false  # Append small jittered obstacle points after shape rasterisation.
  seed: 1           # Base seed; each generated dataset sample uses seed + its index.

# Select the overall environment family. Valid values are: structured,
# corridor, random_land, mountains, blocks, and mixed. Friendly aliases are
# random_terrain, mountain, urban, and city. Every preset is adjusted to the
# shared occupancy target; family-specific options still define the geometry.
environment:
  type: random_land

  # corridor: full-map maze; openings set passage width and loops add alternate routes.
  width: 6.0
  wall_height: 2.5
  partition_spacing: 6.0
  opening_width: 1.5

  # mixed: seeded terrain is solid below a smoothed height field.
  base_height: 0.0
  height_range: 1.0
  smoothing_passes: 5

  # mountains: sum of smooth Gaussian hills; heights are clipped to map height.
  mountain_count: 5
  peak_height: 2.0
  spread_min: 1.5
  spread_max: 4.0

  # structured and blocks: rectangular building footprints/heights in metres.
  building_count: 20
  min_width: 1.0
  max_width: 3.0
  min_height: 0.8
  max_height: 2.5

dataset:
  save_map: true
  samples_num: 1
  start_index: 0  # First number used in saved pt<index>.pcd/.npy filenames.
  path: outputs/dataset

clear:
  enabled: false  # Remove obstacle points near listed start/goal coordinates after generation.
  path: data/clear_pos/clear_3d.csv

dyn:
  dyn_mode: false  # Assign horizontal velocities to generated shapes for subsequent updates.
  v_x_h: 1.0
  v_y_h: 1.0
  v_z_h: 0.0
  dt: 0.1

visualize: true    # Save a Matplotlib preview and show it unless --no-show is passed.
use_open3d: false  # Use the interactive Open3D viewer instead of Matplotlib.
